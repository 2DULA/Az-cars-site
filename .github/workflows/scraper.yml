name: Scrape Auctions
on:
  schedule:
    # Runs at 00:00 and 20:00 UTC daily (~12-16 hour gaps)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run scraper
        run: python scraper/simple.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
